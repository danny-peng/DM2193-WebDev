<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link rel="stylesheet" href="css/contact.css" />
    <title>CSS Vars | Contact Us</title>

  </head>
  <body id="blue">
    <div class="container">
      <h1>Get in Touch!</h1>
      <form method="POST" action="https://formspree.io/f/xvzwklkz">
        <div class="row">
          <label for="name" class="label-lg">Name: </label>
          <input type="text" name="name" class="input-lg" required />

          <label for="email" class="label-lg">Email: </label>
          <input type="email" name="email" class="input-lg" required />
        </div>
        <div class="message-area">
          <label for="message">Leave a Message!</label>
          <textarea name="message" class="message" placeholder="Drop us a question or comment!" required></textarea>
        </div>
        
        <div class="button-bar">
          <button type="submit" class="btn-dark">Send</button>
        </div>
        <input type="hidden" name="subject" value="New Submission from {{name}}" />
      </form>
    </div>
  </body>
</html>
